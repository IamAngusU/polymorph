[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymorph-bridge"
version = "0.3.0"
description = "Policy-driven adaptive data bridge with an opaque data plane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "Angus Uelsmann" }
]
keywords = ["data-integration", "schema-matching", "privacy", "security", "etl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=44.0",
  "openpyxl>=3.1",
  "defusedxml>=0.7.1",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "json5>=0.9",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
postgres = ["psycopg[binary]>=3.2"]
fileid = ["magika>=1.0"]
csv-detection = ["clevercsv>=0.8"]
benchmark = ["psutil>=6.0"]
semantic = [
  "huggingface-hub>=0.27",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
polymorph = "polymorph.cli:main"

[project.urls]
Homepage = "https://angusu.de"
Repository = "https://github.com/IamAngusU/polymorph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["polymorph"]
