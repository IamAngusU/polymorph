[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polymorph-bridge"
version = "0.4.0a7"
description = "Local-first trust layer for safe data mapping and encrypted delivery."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Angus Uelsmann" }
]
keywords = ["data-integration", "schema-matching", "privacy", "security", "etl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=44.0",
  "openpyxl>=3.1",
  "defusedxml>=0.7.1",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "json5>=0.9",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
postgres = ["psycopg[binary]>=3.2"]
fileid = ["magika>=1.0"]
csv-detection = ["clevercsv>=0.8"]
benchmark = ["psutil>=6.0"]
parquet = ["pyarrow>=18.0"]
semantic = [
  "huggingface-hub>=0.27",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "sentencepiece>=0.2",
]
dev = [
  "build>=1.2,!=1.6.0",
  "hypothesis>=6.100",
  "keyring>=25.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-openpyxl>=3.1",
  "types-psutil>=6.0",
]

[project.scripts]
polymorph = "polymorph.cli:main"
polymorph-review = "polymorph.review_metrics:main"
polymorph-kit = "polymorph.toolkit:main"

[project.urls]
Homepage = "https://angusu.de"
Repository = "https://github.com/IamAngusU/polymorph"
Documentation = "https://github.com/IamAngusU/polymorph/tree/main/docs"
Changelog = "https://github.com/IamAngusU/polymorph/blob/main/CHANGELOG.md"
Issues = "https://github.com/IamAngusU/polymorph/issues"
Security = "https://github.com/IamAngusU/polymorph/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polymorph = ["py.typed", "data/*.json", "ui/*.js", "ui/*.html", "ui/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["polymorph"]

[[tool.mypy.overrides]]
module = [
  "onnxruntime",
  "onnxruntime.*",
  "pyarrow",
  "pyarrow.*",
  "sentencepiece",
  "sentencepiece.*",
]
ignore_missing_imports = true
