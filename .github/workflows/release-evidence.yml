name: Manual release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and verify locally reproducible evidence
        run: |
          python -m pip install --disable-pip-version-check build packaging
          python -m build
          python scripts/build_release_evidence.py \
            --artifact "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --artifact "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python scripts/verify_release_evidence.py dist/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
            dist/sbom.cdx.json
