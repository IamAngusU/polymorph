name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -W error -m compileall -q src tests scripts examples.py
      - name: Ruff
        run: python -m ruff check src tests scripts examples.py
      - name: Ruff formatting
        run: python -m ruff format --check src tests scripts examples.py
      - name: Strict type checking
        run: python -m mypy
      - name: Executable example
        run: python examples.py
      - name: Dependency consistency
        run: python -m pip check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -W error -m compileall -q src
      - name: Tests, warnings are errors
        run: python -W error -m pytest --strict-config --strict-markers
      - name: Mapping safety regression
        run: >-
          python -W error -m polymorph benchmark mapping benchmarks/safety-regression.json
          --require-auto-precision 1.0 --require-automation-coverage 0.70
          --max-unsafe-auto 0
      - name: Dependency consistency
        run: python -m pip check

  workflow-lab:
    name: Real workflow and failure lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install workflow lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,benchmark,fileid]"
      - name: Install Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcap-dev meson ninja-build pkg-config
          archive="$RUNNER_TEMP/bubblewrap-0.12.0.tar.xz"
          source_dir="$RUNNER_TEMP/bubblewrap-0.12.0"
          build_dir="$source_dir/build"
          install_prefix="$RUNNER_TEMP/bubblewrap-prefix"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  $archive" \
            | sha256sum --check --strict
          tar --extract --file "$archive" --directory "$RUNNER_TEMP"
          meson setup "$build_dir" "$source_dir" --buildtype=release \
            --prefix="$install_prefix" -Dtests=false -Dman=disabled \
            -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile --jobs 2 --verbose -C "$build_dir"
          meson install --no-rebuild -C "$build_dir"
          export PATH="$install_prefix/bin:$PATH"
          echo "$install_prefix/bin" >> "$GITHUB_PATH"
          hash -r
          bwrap_path="$(command -v bwrap)"
          test -x "$bwrap_path"
          test ! -u "$bwrap_path"
          test ! -g "$bwrap_path"
          test "$(bwrap --version)" = "bubblewrap 0.12.0"
          if sysctl kernel.apparmor_restrict_unprivileged_userns; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --bind / / --tmpfs /tmp true
      - name: Record sandbox toolchain evidence
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import platform
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          bwrap = Path(shutil.which("bwrap") or "").resolve(strict=True)

          def command_version(*command: str) -> str:
              return subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=10,
              ).stdout.strip()

          def debian_package_version(name: str) -> str:
              return command_version(
                  "dpkg-query",
                  "--show",
                  "--showformat=${Version}",
                  name,
              )

          payload = {
              "bubblewrap": {
                  "binary_sha256": hashlib.sha256(bwrap.read_bytes()).hexdigest(),
                  "source_archive_sha256":
                      "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314",
                  "version": command_version(str(bwrap), "--version"),
              },
              "build_tools": {
                  "gcc": command_version("gcc", "--version").splitlines()[0],
                  "libcap-dev": debian_package_version("libcap-dev"),
                  "meson": command_version("meson", "--version"),
                  "ninja": command_version("ninja", "--version"),
              },
              "platform": platform.platform(),
              "python": sys.version,
              "python_packages": {
                  name: importlib.metadata.version(name)
                  for name in ("magika", "polymorph-bridge", "psutil")
              },
          }
          Path("sandbox-toolchain.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Measure the real local workflow
        run: >-
          python -W error -m polymorph benchmark workflow --records 1000 --batch-size 100
          --work-dir workflow-run --output workflow-benchmark.json
      - name: Gate workflow integrity and coarse performance
        run: >-
          python scripts/check_workflow_performance.py workflow-benchmark.json
          --min-throughput 125 --max-wall-seconds 8 --max-peak-rss-mib 200
          --expected-records 1000 --expected-batch-size 100
          --output workflow-performance-gate.json
      - name: Prove strict parser-worker OS sandbox
        if: always()
        run: |
          python -W error -m polymorph inspect isolated-content \
            tests/fixtures/csv-spectrum/csvs/comma_in_quotes.csv \
            --backend bubblewrap --require-containment os-sandbox \
            --output parser-worker-strict-inspection.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("parser-worker-strict-inspection.json").read_text(encoding="utf-8")
          )
          worker = payload["worker"]
          assert worker["backend"] == "bubblewrap", worker
          assert worker["isolation_level"] == "os_sandbox", worker
          assert worker["os_sandboxed"] is True, worker
          assert worker["structured_parsers_isolated"] is False, worker
          PY
      - name: Prove strict parser-worker with Magika
        if: always()
        run: |
          python -W error -m polymorph inspect isolated-content \
            tests/fixtures/csv-spectrum/csvs/comma_in_quotes.csv \
            --magika --backend bubblewrap --require-containment os-sandbox \
            --output parser-worker-strict-magika.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("parser-worker-strict-magika.json").read_text(encoding="utf-8")
          )
          worker = payload["worker"]
          classifier = payload["content"]["classifier"]
          assert worker["backend"] == "bubblewrap", worker
          assert worker["os_sandboxed"] is True, worker
          assert classifier is not None, payload["content"]
          assert classifier["provider"] == "magika", classifier
          PY
      - name: Measure strict parser-worker boundary
        if: always()
        run: |
          python -W error -m polymorph benchmark parser-worker \
            tests/fixtures/csv-spectrum/csvs/comma_in_quotes.csv \
            --runs 5 --backend bubblewrap --require-containment os-sandbox \
            --output parser-worker-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("parser-worker-benchmark.json").read_text(encoding="utf-8")
          )
          assert payload["backend"] == "bubblewrap", payload
          assert payload["isolation_level"] == "os_sandbox", payload
          assert payload["os_sandboxed"] is True, payload
          assert payload["consistent"] is True, payload
          assert payload["runs"] == 5, payload
          assert payload["scope"] == "content_inspection_only", payload
          assert payload["structured_parsers_isolated"] is False, payload
          resources = payload["resource_observation"]
          assert resources["mode"] == "sampled_process_tree", resources
          assert resources["successful_sample_count"] >= payload["runs"], resources
          assert payload["child_peak_rss_bytes"] > 0, payload
          PY
      - name: Validate operational event health
        if: always()
        run: |
          run_id="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("workflow-benchmark.json").read_text(encoding="utf-8"))["workflow"]["observability"]["run_id"])')"
          python -W error -m polymorph events check workflow-run/operational-events.jsonl \
            --run-id "$run_id" --output operational-health.json
      - name: Exercise failure and recovery boundaries
        if: always()
        run: >-
          python -W error -m pytest tests/test_workflow_failure_lab.py
          tests/test_recovery_stress.py tests/test_recovery_processes.py
          tests/test_delivery_state_machine.py tests/test_recipient_auth.py
          tests/test_content_differential.py tests/test_network_fault_lab.py
          tests/test_json_test_suite.py tests/test_w3c_csvw.py
          --strict-config --strict-markers
          --durations=0 --junitxml=workflow-failure-and-recovery-lab.xml
      - name: Exercise parser-worker isolation boundaries
        if: always()
        run: >-
          python -W error -m pytest tests/test_isolation.py tests/test_isolation_cli.py
          tests/test_parser_worker.py tests/test_content_limits.py
          --strict-config --strict-markers
          --durations=0 --junitxml=parser-worker-isolation.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: workflow-lab-evidence
          path: |
            workflow-benchmark.json
            workflow-performance-gate.json
            parser-worker-strict-inspection.json
            parser-worker-strict-magika.json
            parser-worker-benchmark.json
            sandbox-toolchain.json
            operational-health.json
            workflow-run/operational-events.jsonl
            workflow-failure-and-recovery-lab.xml
            parser-worker-isolation.xml
          if-no-files-found: warn
          retention-days: 14

  bootstrap:
    name: Bootstrap (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap without large model downloads
        run: python scripts/bootstrap.py --skip-models --skip-checks
      - name: Installed CLI smoke
        run: python scripts/dev.py doctor

  package:
    needs: [quality, test, workflow-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build!=1.6.0" twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Check source distribution contents
        run: python scripts/check_sdist.py dist/*.tar.gz
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from importlib.metadata import version; import polymorph; assert polymorph.__version__ == version('polymorph-bridge')"
          "$RUNNER_TEMP/wheel-smoke/bin/polymorph" --help
          "$RUNNER_TEMP/wheel-smoke/bin/polymorph" doctor
          "$RUNNER_TEMP/wheel-smoke/bin/polymorph" key certificate-inspect --help
          "$RUNNER_TEMP/wheel-smoke/bin/polymorph" key certificate-accept --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from polymorph.observability import EventStream; s=EventStream('$RUNNER_TEMP/wheel-events.jsonl', run_id='11'*16); c=s.correlation_id('workflow'); s.emit(component='workflow_benchmark', event_type='workflow_started', status='started', correlation_id=c, item_count=0); s.emit(component='workflow_benchmark', event_type='workflow_completed', status='passed', correlation_id=c, item_count=0)"
          "$RUNNER_TEMP/wheel-smoke/bin/polymorph" events check "$RUNNER_TEMP/wheel-events.jsonl" --run-id 11111111111111111111111111111111
      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-smoke/bin/python" -c "from importlib.metadata import version; import polymorph; assert polymorph.__version__ == version('polymorph-bridge')"
          "$RUNNER_TEMP/sdist-smoke/bin/polymorph" --help
          "$RUNNER_TEMP/sdist-smoke/bin/polymorph" doctor
          "$RUNNER_TEMP/sdist-smoke/bin/polymorph" key certificate-inspect --help
          "$RUNNER_TEMP/sdist-smoke/bin/polymorph" key certificate-accept --help
          "$RUNNER_TEMP/sdist-smoke/bin/python" -c "from polymorph.observability import EventStream; s=EventStream('$RUNNER_TEMP/sdist-events.jsonl', run_id='22'*16); c=s.correlation_id('workflow'); s.emit(component='workflow_benchmark', event_type='workflow_started', status='started', correlation_id=c, item_count=0); s.emit(component='workflow_benchmark', event_type='workflow_completed', status='passed', correlation_id=c, item_count=0)"
          "$RUNNER_TEMP/sdist-smoke/bin/polymorph" events check "$RUNNER_TEMP/sdist-events.jsonl" --run-id 22222222222222222222222222222222
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: polymorph-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  model-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [bootstrap, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap with explicit research encoder
        run: python scripts/bootstrap.py --skip-checks --include-research-encoder
      - name: Model-assisted mapping safety regression
        run: >-
          python scripts/dev.py benchmark mapping benchmarks/safety-regression.json --models
          --require-auto-precision 1.0 --require-automation-coverage 0.70
          --require-suggestion-accuracy 0.60 --max-unsafe-auto 0
          --output model-safety.json
      - name: Record model installation status
        run: python scripts/dev.py doctor > model-doctor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-smoke-evidence
          path: |
            model-safety.json
            model-doctor.json
          if-no-files-found: error
          retention-days: 30
