name: Branch validation

on:
  push:
    branches: [fix/batch-release-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir -p evidence
          git archive --format=zip --output=evidence/source.zip HEAD
          git rev-parse HEAD > evidence/source-commit.txt
          sha256sum evidence/source.zip > evidence/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-source-${{ github.sha }}
          path: |
            evidence/source.zip
            evidence/source-commit.txt
            evidence/source.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install test and build dependencies
        run: |
          python -m pip install -e ".[dev,benchmark]" twine
          python -m pip check
      - name: Tests
        run: >-
          python -W error -m pytest --strict-config --strict-markers
          --junitxml=evidence/tests.xml --cov=polymorph --cov-report=term-missing
          --cov-report=xml:evidence/coverage.xml
      - name: Static checks
        if: always()
        run: |
          python -m ruff check src tests scripts examples.py
          python -m ruff format --check src tests scripts examples.py
          python -m mypy
          python -W error -m compileall -q src tests scripts examples.py
      - name: Real workflow
        if: success()
        run: |
          python -W error -m polymorph benchmark workflow --records 1000 --batch-size 100 --work-dir evidence/workflow --output evidence/workflow.json
          python scripts/check_workflow_performance.py evidence/workflow.json --min-throughput 125 --max-wall-seconds 8 --max-peak-rss-mib 200 --expected-records 1000 --expected-batch-size 100 --output evidence/performance-gate.json
      - name: Build and inspect packages
        if: success()
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_sdist.py dist/*.tar.gz
          python -m pip freeze > evidence/python-packages.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: branch-validation-${{ github.sha }}
          path: |
            evidence/*.xml
            evidence/*.json
            evidence/python-packages.txt
            dist/*
          if-no-files-found: warn
          retention-days: 7
